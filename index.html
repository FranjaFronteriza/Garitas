<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garitas Mexicali en Vivo</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --verde: #10b981;
            --amarillo: #f59e0b;
            --rojo: #ef4444;
            --borde: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 1150px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--borde); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        .badge-live { background: rgba(16, 185, 129, 0.15); color: var(--verde); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: var(--verde); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .update-time { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); gap: 10px; }
        .garita-title { font-weight: 700; font-size: 1.05rem; }
        .tiempo-pill { padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
        .fluido { background: rgba(16, 185, 129, 0.2); color: var(--verde); }
        .moderado { background: rgba(245, 158, 11, 0.2); color: var(--amarillo); }
        .saturado { background: rgba(239, 68, 68, 0.2); color: var(--rojo); }
        .foto-container { position: relative; width: 100%; height: 210px; background: #0b1120; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .foto-container img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
        .foto-container img:hover { transform: scale(1.03); }
        .foto-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(15, 23, 42, 0.82); color: #e2e8f0; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; backdrop-filter: blur(4px); }
        .sin-foto-placeholder { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px; }
        .card-body { padding: 14px 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .resumen { font-size: 0.93rem; line-height: 1.45; color: #e2e8f0; }
        .meta { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; border-top: 1px solid rgba(51, 65, 85, 0.5); padding-top: 8px; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        #modal img { max-width: 95%; max-height: 90vh; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Garitas Mexicali — En Vivo</h1>
        <div class="update-time" id="ultima-act">Cargando reportes...</div>
    </div>
    <div class="badge-live"><span class="dot"></span> EN VIVO</div>
</header>

<div class="grid" id="contenedor-garitas"></div>

<div id="modal" onclick="this.style.display='none'">
    <img id="modal-img" src="" alt="Evidencia ampliada">
</div>

<script>
const GARITAS_ORDEN = [
    { nombre: "Garita Centro Av. Colón", archivo: "memoria_sistema/evidencia_GaritaCentroAvColon.jpg" },
    { nombre: "Garita Centro Pueblo Nuevo", archivo: "memoria_sistema/evidencia_GaritaCentroPuebloNuevo.jpg" },
    { nombre: "Garita Nuevo Mexicali", archivo: "memoria_sistema/evidencia_GaritaNuevoMexicali.jpg" },
    { nombre: "Cruce Peatonal", archivo: "memoria_sistema/evidencia_CrucePeatonal.jpg" },
    { nombre: "Permisos I-94", archivo: "memoria_sistema/evidencia_PermisosI94.jpg" }
];

function ampliarFoto(src) {
    document.getElementById('modal-img').src = src;
    document.getElementById('modal').style.display = 'flex';
}

async function cargarDatos() {
    try {
        const res = await fetch(`reportes_garitas.json?t=${Date.now()}`);
        const data = await res.json();
        document.getElementById('ultima-act').textContent = `Última actualización: ${data.ultima_actualizacion || 'Reciente'}`;

        const contenedor = document.getElementById('contenedor-garitas');
        contenedor.innerHTML = '';

        GARITAS_ORDEN.forEach(g => {
            const info = (data.reportes && data.reportes[g.nombre]) || {};
            const estado = info.estado || 'moderado';
            const tiempo = info.tiempo_estimado || 'Sin reporte';
            const resumen = info.resumen || 'Esperando reporte reciente de la fila.';
            const haceCuanto = info.hace_cuanto || '--';
            const rutaFoto = `${info.foto_url || g.archivo}?t=${Date.now()}`;
            const etiquetaFoto = info.fecha_foto ? `Foto: ${info.fecha_foto}` : 'Última evidencia';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="garita-title">${g.nombre}</span>
                    <span class="tiempo-pill ${estado}">${tiempo}</span>
                </div>
                <div class="foto-container">
                    <img src="${rutaFoto}" alt="${g.nombre}" onclick="ampliarFoto(this.src)"
                         onerror="this.parentElement.innerHTML='<div class=\\'sin-foto-placeholder\\'>📷 Esperando primera foto reciente de esta garita</div>'">
                    <span class="foto-tag">${etiquetaFoto}</span>
                </div>
                <div class="card-body">
                    <p class="resumen">${resumen}</p>
                    <div class="meta">
                        <span>Reporte: <strong>${haceCuanto}</strong></span>
                        <span>Clic para ampliar</span>
                    </div>
                </div>
            `;
            contenedor.appendChild(card);
        });
    } catch (err) {
        console.error("Error cargando JSON:", err);
    }
}

cargarDatos();
setInterval(cargarDatos, 30000);
</script>
</body>
</html>
